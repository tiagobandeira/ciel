<style>

</style></head><body>
<canvas id="c"></canvas><div id="hud"></div><div id="cap"></div><div id="chat" class="vazio"><div id="msgs"></div></div>
<div id="bar"><div class="row"><input id="msg" placeholder="Fale com o Ciel" autocomplete="off"><button id="send">Enviar</button><button id="mic">Falar</button></div><div class="row dbg" id="st"></div><div class="row dbg" id="sh"></div><div class="row dbg" id="vz"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=Math.random,$=id=>document.getElementById(id);
// Ajustes de voz. Por enquanto no código; se virar config, o lugar é "ui_voz" no ciel_config.json.
const PAUSA_FALA_MS=2000;   // silêncio (ms) que encerra a gravação; ?pausa=1500 testa outro valor
let N,cache,geo,pts,amp=0,T=0;
const cur={st:'repouso',sh:'esfera',tx:'CIEL'};
const rd=new THREE.WebGLRenderer({canvas:$('c'),alpha:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,100),grp=new THREE.Group();sc.add(grp);

// MAXL = número máximo de camadas suportadas pelo shader.
const MAXL=16;
const u={
  uT:{value:1},uTime:{value:0},uT0:{value:0},uAmp:{value:0},uSize:{value:2.4},
  uPix:{value:rd.getPixelRatio()},uZ:{value:8},
  uMatCamada:{value:Array.from({length:MAXL},()=>new THREE.Matrix4())},
  uMatFrom:{value:Array.from({length:MAXL},()=>new THREE.Matrix4())}
};
const mat=new THREE.ShaderMaterial({uniforms:u,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`attribute vec4 aFrom,aTo;attribute float aR;attribute float aCamada;attribute float aCamadaFrom;
uniform float uT,uTime,uT0,uAmp,uSize,uPix,uZ;uniform mat4 uMatCamada[${MAXL}];uniform mat4 uMatFrom[${MAXL}];
varying vec3 vC;varying float vA;
vec2 rot(vec2 p,float a){float c=cos(a),s=sin(a);return vec2(c*p.x-s*p.y,s*p.x+c*p.y);}
void main(){
vec3 a=aFrom.xyz;a.xy=rot(a.xy,uT0*aFrom.w);
vec3 b=aTo.xyz;b.xy=rot(b.xy,uTime*aTo.w);
float t=clamp((uT-aR*.45)/.55,0.,1.);t=t*t*(3.-2.*t);
vec3 p=mix(a,b,t);float k=sin(3.14159*t);
vec3 n=vec3(sin(aR*40.+uTime*1.3),cos(aR*57.+uTime*1.1),sin(aR*23.+uTime*.9));
p+=n*k*1.8+n*.015;p*=1.+uAmp*(.7+.3*sin(aR*50.));
int li=int(aCamada+.5),lf=int(aCamadaFrom+.5);
mat4 LM=mat4(1.0),LF=mat4(1.0);
for(int i=0;i<${MAXL};i++){ if(i==li) LM=uMatCamada[i]; if(i==lf) LF=uMatFrom[i]; }
p=mix((LF*vec4(p,1.0)).xyz,(LM*vec4(p,1.0)).xyz,t);
vec4 mv=modelViewMatrix*vec4(p,1.);
gl_PointSize=min(uSize*uPix*(.6+aR)*(uZ/-mv.z),48.);
gl_Position=projectionMatrix*mv;
vC=mix(vec3(.12,.42,1.),vec3(.6,.95,1.),aR*aR)+uAmp*.6;vA=.55+.45*aR;}`,
fragmentShader:`varying vec3 vC;varying float vA;
void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float f=smoothstep(.5,0.,d);gl_FragColor=vec4(vC*1.3,f*vA);}`});

// amostradores: cada um adiciona n pontos [x,y,z,spin]
const box=(o,n,w,h,d,cx,cy,cz)=>{const A=[w*h*2,w*d*2,h*d*2],S=A[0]+A[1]+A[2];
for(let i=0;i<n;i++){const r=R()*S,s=R()<.5?-.5:.5,a=R()-.5,b=R()-.5;
if(r<A[0])o.push(a*w+cx,b*h+cy,s*d+cz,0);else if(r<A[0]+A[1])o.push(a*w+cx,s*h+cy,b*d+cz,0);else o.push(s*w+cx,a*h+cy,b*d+cz,0)}};
const cyl=(o,n,r,w,cx,cy,cz)=>{for(let i=0;i<n;i++){const a=R()*6.283;let q=r,z=(R()-.5)*w;if(R()<.35){q=r*Math.sqrt(R());z=(R()<.5?-.5:.5)*w}o.push(Math.cos(a)*q+cx,Math.sin(a)*q+cy,z+cz,0)}};
const sph=(o,n,r,cx,cy,cz,sp)=>{for(let i=0;i<n;i++){const v=R()*2-1,a=R()*6.283,s=Math.sqrt(1-v*v);o.push(cx+s*Math.cos(a)*r,cy+s*Math.sin(a)*r,cz+v*r,sp)}};
const ring=(o,n,r,sp,j)=>{for(let i=0;i<n;i++){const a=R()*6.283,q=r+(R()-.5)*j;o.push(Math.cos(a)*q,Math.sin(a)*q,(R()-.5)*.06,sp)}};
const tri=(o,n,r,rot,sp)=>{for(let i=0;i<n;i++){const a=rot+((R()*3)|0)*2.0944,b=a+2.0944,t=R();o.push(r*(Math.cos(a)*(1-t)+Math.cos(b)*t),r*(Math.sin(a)*(1-t)+Math.sin(b)*t),(R()-.5)*.06,sp)}};

// mk devolve {pos: Float32Array(N*4), camada: Float32Array(N)}
function mk(parts, camadasPorParte){
  const o=[], ca=[];
  let used=0;
  parts.forEach(([f,fn],i)=>{
    const n=i==parts.length-1?N-used:Math.round(N*f);
    const antes=o.length/4;
    fn(o,n);
    const c=camadasPorParte?(+camadasPorParte[i]||0):0;
    for(let j=antes;j<antes+n;j++) ca.push(c);
    used+=n;
  });
  const a=Float32Array.from(o);
  const c=Float32Array.from(ca);
  for(let i=N-1;i>0;i--){
    const j=(R()*(i+1))|0;
    for(let k=0;k<4;k++){const t=a[i*4+k];a[i*4+k]=a[j*4+k];a[j*4+k]=t}
    const t=c[i];c[i]=c[j];c[j]=t;
  }
  return {pos:a,camada:c};
}

const W=[[1.3,.9],[1.3,-.9],[-1.3,.9],[-1.3,-.9]].map(([x,z])=>[.105,(o,n)=>cyl(o,n,.45,.3,x,-.6,z)]);
const S={
esfera:()=>mk([[1,(o,n)=>{for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),t=i*2.39996;o.push(Math.cos(t)*r*2.2,y*2.2,Math.sin(t)*r*2.2,0)}}]]),
circulo:()=>mk([[.2,(o,n)=>ring(o,n,3.4,.12,.07)],[.12,(o,n)=>ring(o,n,3,.12,.05)],
[.1,(o,n)=>{for(let i=0;i<n;i++){const a=((R()*36)|0)*.17453,q=3.05+R()*.3;o.push(Math.cos(a)*q,Math.sin(a)*q,0,.12)}}],
[.17,(o,n)=>tri(o,n,2.5,0,-.18)],[.17,(o,n)=>tri(o,n,2.5,1.0472,-.18)],
[.08,(o,n)=>ring(o,n,1.5,.3,.05)],[.06,(o,n)=>tri(o,n,.95,.5,-.5)],[.1,(o,n)=>sph(o,n,.25,0,0,0,0)]]),
carro:()=>mk([[.38,(o,n)=>box(o,n,4,.7,1.8,0,-.15,0)],[.2,(o,n)=>box(o,n,2.1,.65,1.6,-.25,.5,0)],...W]),
casa:()=>mk([[.45,(o,n)=>box(o,n,3,2,2.4,0,-.5,0)],
[.3,(o,n)=>{for(let i=0;i<n;i++){const s=R()<.5?-1:1,t=R();o.push(s*1.75*(1-t),.5+1.3*t,(R()-.5)*2.7,0)}}],
[.1,(o,n)=>box(o,n,.6,1.1,.12,0,-.95,1.25)],[.07,(o,n)=>box(o,n,.5,.5,.1,-.9,-.3,1.22)],[.08,(o,n)=>box(o,n,.5,.5,.1,.9,-.3,1.22)]]),
solar:()=>{const P=[[.22,(o,n)=>sph(o,n,.5,0,0,0,0)]];
[1,1.6,2.2,2.9,3.6].forEach((r,i)=>{const sp=.9/(i+1),a=R()*6.283;
P.push([.05,(o,n)=>ring(o,n,r,sp,.03)]);P.push([.1,(o,n)=>sph(o,n,.09+.03*i,Math.cos(a)*r,Math.sin(a)*r,0,sp)])});return mk(P)},
palavra:t=>{const c=document.createElement('canvas'),x=c.getContext('2d'),f='bold 120px system-ui,sans-serif';
x.font=f;const w=Math.ceil(x.measureText(t).width)+40,h=180;c.width=w;c.height=h;
x.font=f;x.textBaseline='middle';x.textAlign='center';x.fillStyle='#fff';x.fillText(t,w/2,h/2);
const d=x.getImageData(0,0,w,h).data,p=[];for(let i=3;i<d.length;i+=4)if(d[i]>128)p.push((i-3)/4);
const k=Math.min(.012,7/w);
return mk([[1,(o,n)=>{for(let i=0;i<n;i++){const q=p[(R()*p.length)|0]||0;o.push(((q%w)-w/2)*k,-(((q/w)|0)-h/2)*k,(R()-.5)*.15,0)}}]])}};

// ---- primitivas por descrição (JSON) ----
const arc=(o,n,r,a0,a1,c,sp)=>{for(let i=0;i<n;i++){const a=(a0+R()*(a1-a0))*.017453,q=r+(R()-.5)*.08;o.push(Math.cos(a)*q+c[0],Math.sin(a)*q+c[1],(R()-.5)*.08+c[2],sp)}};
const seg=(o,n,A,B)=>{for(let i=0;i<n;i++){const t=R();o.push(A[0]+(B[0]-A[0])*t+(R()-.5)*.1,A[1]+(B[1]-A[1])*t+(R()-.5)*.1,A[2]+(B[2]-A[2])*t+(R()-.5)*.1,0)}};
const svg=(o,n,d,sz,c)=>{const g=document.createElement('canvas');g.width=g.height=200;const x=g.getContext('2d');x.fillStyle='#fff';try{x.fill(new Path2D(d))}catch(e){}
const a=x.getImageData(0,0,200,200).data,p=[];for(let i=3;i<a.length;i+=4)if(a[i]>128)p.push((i-3)/4);
for(let i=0;i<n;i++){const q=p[(R()*p.length)|0]||0;o.push(((q%200)/200-.5)*sz+c[0],-(((q/200)|0)/200-.5)*sz+c[1],(R()-.5)*.15+c[2],0)}};
const num=(x,d,m)=>Math.max(-m,Math.min(m,isFinite(+x)?+x:d)),v3=(a,d)=>[0,1,2].map(i=>num(a&&a[i],d[i],6));

// fromSpec aceita nuvem de pontos (com camadas) OU lista de partes
function fromSpec(sp){
  if(sp.pontos&&sp.pontos.length){
    const P=sp.pontos;
    const pos=new Float32Array(N*4);
    const camada=new Float32Array(N);
    for(let i=0;i<N;i++){
      const p=P[(R()*P.length)|0];
      pos[i*4]   = +p[0]||0;
      pos[i*4+1] = +p[1]||0;
      pos[i*4+2] = +p[2]||0;
      pos[i*4+3] = 0;
      camada[i]  = (p.length>=4) ? (+p[3]||0) : 0;
    }
    return {pos, camada};
  }
  const L=(sp.partes||[]).slice(0,24);if(!L.length)throw Error('sem partes');
  const tot=L.reduce((s,p)=>s+Math.max(.01,+p.peso||1),0);
  return mk(L.map(p=>{const f=Math.max(.01,+p.peso||1)/tot,c=v3(p.pos,[0,0,0]),s=v3(p.tam,[1,1,1]).map(Math.abs),r=Math.abs(num(p.r,1,6)),g=num(p.giro,0,3),A=p.a||[0,360];let fn;
  switch(p.tipo){case'box':fn=(o,n)=>box(o,n,s[0],s[1],s[2],...c);break;
  case'cil':fn=(o,n)=>{const Lc=Math.abs(num(p.l,.4,6));if(p.eixo==='y'){const t=[];cyl(t,n,r,Lc,0,0,0);for(let i=0;i<t.length;i+=4)o.push(t[i]+c[0],t[i+2]+c[1],t[i+1]+c[2],0)}else cyl(o,n,r,Lc,...c)};break;
  case'esf':fn=(o,n)=>sph(o,n,r,...c,g);break;
  case'anel':case'arco':fn=(o,n)=>arc(o,n,r,num(A[0],0,720),num(A[1],360,720),c,g);break;
  case'linha':fn=(o,n)=>seg(o,n,v3(p.de,[0,0,0]),v3(p.ate,[1,0,0]));break;
  case'svg':fn=(o,n)=>svg(o,n,String(p.d||''),p.tam?s[0]:4,c);break;
  default:throw Error('tipo desconhecido: '+p.tipo)}return[f,fn]}))
}
const LIB={sorriso:{partes:[{tipo:'anel',r:2.2,peso:4},{tipo:'esf',r:.22,pos:[-.8,.7,0],peso:1},{tipo:'esf',r:.22,pos:[.8,.7,0],peso:1},{tipo:'arco',r:1.3,a:[200,340],pos:[0,.1,0],peso:2.5}]},
'coração':{partes:[{tipo:'svg',d:'M100 176 C20 110 10 50 56 30 C80 20 100 40 100 56 C100 40 120 20 144 30 C190 50 180 110 100 176Z',tam:[4.2]}]},
check:{partes:[{tipo:'linha',de:[-1.8,0,0],ate:[-.5,-1.3,0],peso:1},{tipo:'linha',de:[-.5,-1.3,0],ate:[2,1.6,0],peso:2},{tipo:'anel',r:2.8,peso:3}]}};
const shape=(n,t)=>n==='palavra'?S.palavra(t):S[n]?(cache[n]||(cache[n]=S[n]())):(cache[n]||(cache[n]=fromSpec(LIB[n])));

// escolhe o modo de giro do objeto: 'y' (3D), 'z' (relógio), 'none' (parado)
const GIRO={};
function detectaGiro(pontos){
  if(!pontos||!pontos.length) return 'y';
  let mnX=1e9,mxX=-1e9,mnY=1e9,mxY=-1e9,mnZ=1e9,mxZ=-1e9;
  for(let i=0;i<pontos.length;i++){const p=pontos[i];
    if(p[0]<mnX)mnX=p[0]; if(p[0]>mxX)mxX=p[0];
    if(p[1]<mnY)mnY=p[1]; if(p[1]>mxY)mxY=p[1];
    if(p[2]<mnZ)mnZ=p[2]; if(p[2]>mxZ)mxZ=p[2];
  }
  const w=mxX-mnX,h=mxY-mnY,d=mxZ-mnZ;
  const fino=d < Math.max(w,h)*0.15;
  const redondo=Math.max(w,h)>0 && Math.min(w,h)/Math.max(w,h) > 0.7;
  return (fino && redondo) ? 'z' : 'y';
}
function modoGiro(n){
  if(GIRO[n]) return GIRO[n];
  const lib=LIB[n];
  if(lib){
    if(lib.giro && lib.giro!=='auto') return lib.giro;
    if(lib.plano) return 'none'; 
    if(lib.pontos && lib.pontos.length) return detectaGiro(lib.pontos);
  }
  return 'y';
}

// ---- poeira ambiente ----
const dm=new THREE.ShaderMaterial({uniforms:u,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`attribute float aR;uniform float uTime,uPix,uZ,uAmp;varying float vA;
void main(){vec3 p=position;float a=uTime*.03*(.5+aR),c=cos(a),s=sin(a);p.xz=vec2(c*p.x-s*p.z,s*p.x+c*p.z);p.y+=sin(uTime*.2+aR*30.)*.6;
vec4 mv=modelViewMatrix*vec4(p,1.);gl_PointSize=min((1.2+aR*1.8)*uPix*(uZ/-mv.z),12.);gl_Position=projectionMatrix*mv;vA=(.12+.25*aR)*(1.+uAmp*3.);}`,
fragmentShader:`varying float vA;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;gl_FragColor=vec4(.35,.6,1.,smoothstep(.5,0.,d)*vA);}`});
{const M=2000,P=new Float32Array(M*3),Q=new Float32Array(M);for(let i=0;i<M;i++){const v=R()*2-1,a=R()*6.283,s=Math.sqrt(1-v*v),r=5+R()*11;P.set([s*Math.cos(a)*r,v*r*.7,s*Math.sin(a)*r],i*3);Q[i]=R()}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('aR',new THREE.BufferAttribute(Q,1));
const dp=new THREE.Points(g,dm);dp.frustumCulled=false;sc.add(dp)}

// pose do grupo por forma: [inclinação, giro em Y] — usado só no modo 'y' sem anim
const POSE={esfera:[.1,.15],circulo:[-.4,0],carro:[.2,.5],casa:[.25,.4],solar:[-1.1,0],palavra:[0,0],sorriso:[0,0],'coração':[0,0],check:[0,0],lupa:[0,0],documento:[0,0],lapis:[0,0],terminal:[0,0],rede:[0,0]};
// Pose vinda do spec (JSON gerado) tem prioridade sobre a tabela fixa.
// plano:true sem pose explícita cai em [0,0] (de frente) em vez do default inclinado.
function poseDe(n){
  const lib=LIB[n];
  if(lib && Array.isArray(lib.pose) && lib.pose.length===2){
    const a=+lib.pose[0], b=+lib.pose[1];
    if(isFinite(a) && isFinite(b)) return [a,b];
  }
  if(POSE[n]) return POSE[n];
  return (lib && lib.plano) ? [0,0] : [.1,.3];
}
const ST={repouso:['esfera',t=>.04*Math.sin(t*1.2)],
ouvindo:['esfera',t=>.05+.08*Math.abs(Math.sin(t*3.1)*Math.sin(t*1.7+1))],
pensando:['circulo',t=>.02*Math.sin(t*2)],
falando:['esfera',t=>.02+.18*Math.abs(Math.sin(t*7)*Math.sin(t*2.3))]};
const TOPIC=['carro','casa','solar','sorriso','coração','check'];

// composição de matrizes de animação por camada
const _M1=new THREE.Matrix4(), _M2=new THREE.Matrix4(), _M3=new THREE.Matrix4();
function matAnim(anims, t, pivo, out){
  out.identity();

    if(VAD.auto&&semFala&&!primeira&&agora-inicio>VAD.semFala){parado=true;nivel=0;encerra('sem fala');return}  // microfone aberto sem ninguém falar
    raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
  return ()=>{parado=true;nivel=0;cancelAnimationFrame(raf);try{src.disconnect()}catch(e){}try{mudo.disconnect()}catch(e){}};
}
// ── modo live: escuta durante o TTS e barge-in ────────────────────────────────
function aquecerAudio(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    audioCtx=audioCtx||new Ctx();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}
function encerrarEscuta(){
  if(!escuta)return;
  const s=escuta;escuta=null;s.descartar=true;
  if(s.soltaVad){s.soltaVad();s.soltaVad=null}
  try{if(s.rec.state==='recording')s.rec.stop()}catch(e){}
  s.stream.getTracks().forEach(t=>t.stop());
  if(gravando===s.rec)gravando=null;
  $('mic').classList.remove('on');$('mic').textContent='Falar';
}
function bargeIn(s,info){
  if(!s||s.triggered||s.descartar||!modoLive||!lendo)return false;
  s.triggered=true;
  s.inicio=Math.max(0,(performance.now()-s.t0)/1000);
  if(escuta===s)escuta=null;   // desanexa: parar() não pode descartar a gravação
  gravando=s.rec;
  vz={inicio:performance.now(),motivo:'barge-in'};if($('vz'))$('vz').textContent='';
  console.log('[live] barge-in em '+s.inicio.toFixed(2)+' s'+(info?' (rms '+info.rms.toFixed(3)+', ruído '+info.ruido.toFixed(3)+', limiar '+info.limiar.toFixed(3)+')':''));
  parar();  // cancela o TTS; a gravação continua como o turno do usuário
  $('mic').classList.add('on');$('mic').textContent='Enviar fala';
  cap('ouvindo… (falou por cima; clique para enviar)');go('ouvindo','esfera');
  return true;
}
async function iniciarEscutaLive(){
  if(_qs.has('nobarge'))return;   // diagnóstico: Live só falando, sem escutar por cima
  if(!modoLive||escuta||gravando||transcrevendo)return;
  if(!navigator.mediaDevices||!window.MediaRecorder)return;
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{
    channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:false,
    googEchoCancellation:true,googAutoGainControl:false,googNoiseSuppression:true,googHighpassFilter:true
  }})}catch(e){console.log('[live] sem microfone para barge-in:',e.message);return}
  if(!modoLive||!lendo||escuta||gravando||transcrevendo){stream.getTracks().forEach(t=>t.stop());return}
  const tipo=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  let rec;
  try{rec=new MediaRecorder(stream,tipo?{mimeType:tipo}:undefined)}catch(e){stream.getTracks().forEach(t=>t.stop());return}
  const partes=[];
  const s={stream,rec,t0:0,inicio:0,triggered:false,descartar:false,soltaVad:null};
  const lim=setTimeout(()=>{if(rec.state==='recording')rec.stop()},600000);
  rec.ondataavailable=e=>{if(e.data.size)partes.push(e.data)};
  rec.onstop=async()=>{
    clearTimeout(lim);
    if(s.soltaVad){s.soltaVad();s.soltaVad=null}
    stream.getTracks().forEach(t=>t.stop());
    if(escuta===s)escuta=null;
    if(gravando===rec)gravando=null;
    $('mic').classList.remove('on');$('mic').textContent='Falar';
    if(s.descartar||!s.triggered)return;
    if(vz){vz.fim=performance.now();vzPublica()}
    const blob=new Blob(partes,{type:rec.mimeType||tipo||'audio/webm'});
    if(blob.size<1200){cap('não entendi, tente de novo');go('repouso',tema||'esfera');vz=null;return}
    cap('transcrevendo…');go('pensando','circulo');transcrevendo=true;
    const t0=performance.now(),tick=setInterval(()=>cap('transcrevendo… '+((performance.now()-t0)/1000).toFixed(1)+' s'),200);
    try{
      const r=await fetch('/ui/voz?inicio='+s.inicio.toFixed(2),{method:'POST',headers:{'Content-Type':blob.type},body:blob});
      const d=await r.json();
      if(!r.ok||!d.ok)throw Error(d.erro||('HTTP '+r.status));
      if(vz){vz.txt=performance.now();vz.srv=d.ms||null;vz.audio_s=d.audio_s;vzPublica()}
      if(!d.texto){cap('não entendi, tente de novo');go('repouso',tema||'esfera');vz=null;return}
      $('msg').value=d.texto;send(true);
    }catch(e){vz=null;ev({tipo:'erro',texto:e.message})}
    finally{transcrevendo=false;clearInterval(tick)}
  };
  escuta=s;
  try{rec.start()}catch(e){escuta=null;stream.getTracks().forEach(t=>t.stop());return}
  s.t0=performance.now();
  console.log('[live] escuta iniciada');
  s.soltaVad=vigiaVoz(stream,()=>{if(rec.state==='recording')rec.stop()},()=>bargeIn(s),false,true);
}
async function mic(){
  if(gravando){if(gravando.state==='recording')gravando.stop();return}
  if(transcrevendo){cap('aguarde a transcrição…');return}
  if(!navigator.mediaDevices||!window.MediaRecorder){cap('⚠ microfone indisponível (precisa de localhost ou HTTPS)');return}
  parar();  // interrompe a leitura em andamento
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}})}catch(e){cap('⚠ sem acesso ao microfone');return}
  const tipo=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(stream,tipo?{mimeType:tipo}:undefined),partes=[];
  const lim=setTimeout(()=>{if(rec.state==='recording')rec.stop()},30000);
  vz={inicio:performance.now()};if($('vz'))$('vz').textContent='';
  rec.ondataavailable=e=>{if(e.data.size)partes.push(e.data)};
  rec.onstop=async()=>{clearTimeout(lim);gravando=null;soltaVad&&soltaVad();soltaVad=null;stream.getTracks().forEach(t=>t.stop());
    $('mic').classList.remove('on');$('mic').textContent='Falar';
    if(vz){vz.motivo=rec._motivo||'clique';vz.fim=performance.now();vzPublica()}
    const blob=new Blob(partes,{type:rec.mimeType||tipo||'audio/webm'});
    if(blob.size<1200){cap(rec._motivo==='sem fala'?'nada captado — tente de novo':'');go('repouso',tema||'esfera');vz=null;return}
    cap('transcrevendo…');go('pensando','circulo');transcrevendo=true;
    const t0=performance.now(),tick=setInterval(()=>cap('transcrevendo… '+((performance.now()-t0)/1000).toFixed(1)+' s'),200);
    try{const r=await fetch('/ui/voz',{method:'POST',headers:{'Content-Type':blob.type},body:blob});const d=await r.json();
      if(!r.ok||!d.ok)throw Error(d.erro||('HTTP '+r.status));
      if(vz){vz.txt=performance.now();vz.srv=d.ms||null;vz.audio_s=d.audio_s;vzPublica()}
      if(!d.texto){cap('não entendi, tente de novo');go('repouso',tema||'esfera');vz=null;return}
      $('msg').value=d.texto;send(true)}
    catch(e){vz=null;ev({tipo:'erro',texto:e.message})}
    finally{transcrevendo=false;clearInterval(tick)}};
  gravando=rec;rec.start();
  soltaVad=vigiaVoz(stream,motivo=>{if(rec.state==='recording'){rec._motivo=motivo;rec.stop()}});
  $('mic').classList.add('on');$('mic').textContent='Enviar fala';
  cap(VAD.auto?'ouvindo… (clique para enviar; encerra sozinho no silêncio)':'ouvindo… (clique para enviar)');go('ouvindo','esfera');
}
