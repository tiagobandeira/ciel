// MAXL = número máximo de camadas suportadas pelo shader.
const MAXL=16;
const u={
  uT:{value:1},uTime:{value:0},uT0:{value:0},uAmp:{value:0},uSize:{value:2.4},
  uPix:{value:rd.getPixelRatio()},uZ:{value:8},

vertexShader:`attribute vec4 aFrom,aTo;attribute float aR;attribute float aCamada;attribute float aCamadaFrom;
uniform float uT,uTime,uT0,uAmp,uSize,uPix,uZ;uniform mat4 uMatCamada[${MAXL}];uniform mat4 uMatFrom[${MAXL}];
varying vec3 vC;varying float vA;
vec2 rot(vec2 p,float a){float c=cos(a),s=sin(a);return vec2(c*p.x-s*p.y,s*p.x+c*p.y);}
void main(){
vec3 a=aFrom.xyz;a.xy=rot(a.xy,uT0*aFrom.w);
vec3 b=aTo.xyz;b.xy=rot(b.xy,uTime*aTo.w);
float t=clamp((uT-aR*.45)/.55,0.,1.);t=t*t*(3.-2.*t);
vec3 p=mix(a,b,t);float k=sin(3.14159*t);
vec3 n=vec3(sin(aR*40.+uTime*1.3),cos(aR*57.+uTime*1.1),sin(aR*23.+uTime*.9));
p+=n*k*1.8+n*.015;p*=1.+uAmp*(.7+.3*sin(aR*50.));
int li=int(aCamada+.5),lf=int(aCamadaFrom+.5);
mat4 LM=mat4(1.0),LF=mat4(1.0);
for(int i=0;i<${MAXL};i++){ if(i==li) LM=uMatCamada[i]; if(i==lf) LF=uMatFrom[i]; }
p=mix((LF*vec4(p,1.0)).xyz,(LM*vec4(p,1.0)).xyz,t);
vec4 mv=modelViewMatrix*vec4(p,1.);
gl_PointSize=min(uSize*uPix*(.6+aR)*(uZ/-mv.z),48.);

vC=mix(vec3(.12,.42,1.),vec3(.6,.95,1.),aR*aR)+uAmp*.6;vA=.55+.45*aR;}`,
fragmentShader:`varying vec3 vC;varying float vA;
void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float f=smoothstep(.5,0.,d);gl_FragColor=vec4(vC*1.3,f*vA);}`});

// amostradores: cada um adiciona n pontos [x,y,z,spin]
const box=(o,n,w,h,d,cx,cy,cz)=>{const A=[w*h*2,w*d*2,h*d*2],S=A[0]+A[1]+A[2];
for(let i=0;i<n;i++){const r=R()*S,s=R()<.5?-.5:.5,a=R()-.5,b=R()-.5;
if(r<A[0])o.push(a*w+cx,b*h+cy,s*d+cz,0);else if(r<A[0]+A[1])o.push(a*w+cx,s*h+cy,b*d+cz,0);else o.push(s*w+cx,a*h+cy,b*d+cz,0)}};
const cyl=(o,n,r,w,cx,cy,cz)=>{for(let i=0;i<n;i++){const a=R()*6.283;let q=r,z=(R()-.5)*w;if(R()<.35){q=r*Math.sqrt(R());z=(R()<.5?-.5:.5)*w}o.push(Math.cos(a)*q+cx,Math.sin(a)*q+cy,z+cz,0)}};
const sph=(o,n,r,cx,cy,cz,sp)=>{for(let i=0;i<n;i++){const v=R()*2-1,a=R()*6.283,s=Math.sqrt(1-v*v);o.push(cx+s*Math.cos(a)*r,cy+s*Math.sin(a)*r,cz+v*r,sp)}};
const ring=(o,n,r,sp,j)=>{for(let i=0;i<n;i++){const a=R()*6.283,q=r+(R()-.5)*j;o.push(Math.cos(a)*q,Math.sin(a)*q,(R()-.5)*.06,sp)}};
const tri=(o,n,r,rot,sp)=>{for(let i=0;i<n;i++){const a=rot+((R()*3)|0)*2.0944,b=a+2.0944,t=R();o.push(r*(Math.cos(a)*(1-t)+Math.cos(b)*t),r*(Math.sin(a)*(1-t)+Math.sin(b)*t),(R()-.5)*.06,sp)}};

// mk devolve {pos: Float32Array(N*4), camada: Float32Array(N)}
function mk(parts, camadasPorParte){
  const o=[], ca=[];
  let used=0;
  parts.forEach(([f,fn],i)=>{
    const n=i==parts.length-1?N-used:Math.round(N*f);
    const antes=o.length/4;
    fn(o,n);
    const c=camadasPorParte?(+camadasPorParte[i]||0):0;
    for(let j=antes;j<antes+n;j++) ca.push(c);
    used+=n;
  });
  const a=Float32Array.from(o);
  const c=Float32Array.from(ca);
  for(let i=N-1;i>0;i--){
    const j=(R()*(i+1))|0;
    for(let k=0;k<4;k++){const t=a[i*4+k];a[i*4+k]=a[j*4+k];a[j*4+k]=t}
    const t=c[i];c[i]=c[j];c[j]=t;
  }
  return {pos:a,camada:c};
}

[.17,(o,n)=>tri(o,n,2.5,0,-.18)],[.17,(o,n)=>tri(o,n,2.5,1.0472,-.18)],

[.1,(o,n)=>box(o,n,.6,1.1,.12,0,-.95,1.25)],[.07,(o,n)=>box(o,n,.5,.5,.1,-.9,-.3,1.22)],[.08,(o,n)=>box(o,n,.5,.5,.1,.9,-.3,1.22)]]),

P.push([.05,(o,n)=>ring(o,n,r,sp,.03)]);P.push([.1,(o,n)=>sph(o,n,.09+.03*i,Math.cos(a)*r,Math.sin(a)*r,0,sp)])});return mk(P)},

// fromSpec aceita nuvem de pontos (com camadas) OU lista de partes
function fromSpec(sp){
  if(sp.pontos&&sp.pontos.length){
    const P=sp.pontos;
    const pos=new Float32Array(N*4);
    const camada=new Float32Array(N);
    for(let i=0;i<N;i++){
      const p=P[(R()*P.length)|0];
      pos[i*4]   = +p[0]||0;
      pos[i*4+1] = +p[1]||0;
      pos[i*4+2] = +p[2]||0;
      pos[i*4+3] = 0;
      camada[i]  = (p.length>=4) ? (+p[3]||0) : 0;
    }
    return {pos, camada};
  }
  const L=(sp.partes||[]).slice(0,24);if(!L.length)throw Error('sem partes');
  const tot=L.reduce((s,p)=>s+Math.max(.01,+p.peso||1),0);
  return mk(L.map(p=>{const f=Math.max(.01,+p.peso||1)/tot,c=v3(p.pos,[0,0,0]),s=v3(p.tam,[1,1,1]).map(Math.abs),r=Math.abs(num(p.r,1,6)),g=num(p.giro,0,3),A=p.a||[0,360];let fn;
  switch(p.tipo){case'box':fn=(o,n)=>box(o,n,s[0],s[1],s[2],...c);break;
  case'cil':fn=(o,n)=>{const Lc=Math.abs(num(p.l,.4,6));if(p.eixo==='y'){const t=[];cyl(t,n,r,Lc,0,0,0);for(let i=0;i<t.length;i+=4)o.push(t[i]+c[0],t[i+2]+c[1],t[i+1]+c[2],0)}else cyl(o,n,r,Lc,...c)};break;
  case'esf':fn=(o,n)=>sph(o,n,r,...c,g);break;
  case'anel':case'arco':fn=(o,n)=>arc(o,n,r,num(A[0],0,720),num(A[1],360,720),c,g);break;
  case'linha':fn=(o,n)=>seg(o,n,v3(p.de,[0,0,0]),v3(p.ate,[1,0,0]));break;
  case'svg':fn=(o,n)=>svg(o,n,String(p.d||''),p.tam?s[0]:4,c);break;
  default:throw Error('tipo desconhecido: '+p.tipo)}return[f,fn]}))
}

// escolhe o modo de giro do objeto: 'y' (3D), 'z' (relógio), 'none' (parado)
const GIRO={};
function detectaGiro(pontos){
  if(!pontos||!pontos.length) return 'y';
  let mnX=1e9,mxX=-1e9,mnY=1e9,mxY=-1e9,mnZ=1e9,mxZ=-1e9;
  for(let i=0;i<pontos.length;i++){const p=pontos[i];
    if(p[0]<mnX)mnX=p[0]; if(p[0]>mxX)mxX=p[0];
    if(p[1]<mnY)mnY=p[1]; if(p[1]>mxY)mxY=p[1];
    if(p[2]<mnZ)mnZ=p[2]; if(p[2]>mxZ)mxZ=p[2];
  }
  const w=mxX-mnX,h=mxY-mnY,d=mxZ-mnZ;
  const fino=d < Math.max(w,h)*0.15;
  const redondo=Math.max(w,h)>0 && Math.min(w,h)/Math.max(w,h) > 0.7;
  return (fino && redondo) ? 'z' : 'y';
}
function modoGiro(n){
  if(GIRO[n]) return GIRO[n];
  const lib=LIB[n];
  if(lib){
    if(lib.giro && lib.giro!=='auto') return lib.giro;
    if(lib.plano) return 'none'; 
    if(lib.pontos && lib.pontos.length) return detectaGiro(lib.pontos);
  }
  return 'y';
}

vec4 mv=modelViewMatrix*vec4(p,1.);gl_PointSize=min((1.2+aR*1.8)*uPix*(uZ/-mv.z),12.);gl_Position=projectionMatrix*mv;vA=(.12+.25*aR)*(1.+uAmp*3.);}`,
fragmentShader:`varying float vA;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;gl_FragColor=vec4(.35,.6,1.,smoothstep(.5,0.,d)*vA);}`});
{const M=2000,P=new Float32Array(M*3),Q=new Float32Array(M);for(let i=0;i<M;i++){const v=R()*2-1,a=R()*6.283,s=Math.sqrt(1-v*v),r=5+R()*11;P.set([s*Math.cos(a)*r,v*r*.7,s*Math.sin(a)*r],i*3);Q[i]=R()}

function poseDe(n){
  const lib=LIB[n];
  if(lib && Array.isArray(lib.pose) && lib.pose.length===2){
    const a=+lib.pose[0], b=+lib.pose[1];
    if(isFinite(a) && isFinite(b)) return [a,b];
  }
  if(POSE[n]) return POSE[n];
  return (lib && lib.plano) ? [0,0] : [.1,.3];
}

// composição de matrizes de animação por camada
const _M1=new THREE.Matrix4(), _M2=new THREE.Matrix4(), _M3=new THREE.Matrix4();
function matAnim(anims, t, pivo, out){
  out.identity();
  if(anims && anims.length){
    for(let i=0;i<anims.length;i++){
      const a=anims[i]; if(!a) continue;
      let m=_M1.identity();
      const fr=(a.freq==null?1:a.freq), fa=(a.fase==null?0:a.fase);
      const fase=2*Math.PI*fr*t + fa;
      if(a.tipo==='rot'||a.tipo==='osc'){
        const ang=(a.tipo==='rot')?(a.vel||0)*t:(a.amp||0)*Math.sin(fase);
        if(a.eixo==='x') m.makeRotationX(ang);
        else if(a.eixo==='y') m.makeRotationY(ang);
        else m.makeRotationZ(ang);
      } else if(a.tipo==='flutuar'){
        const d=(a.amp||0)*Math.sin(fase);
        if(a.eixo==='x') m.makeTranslation(d,0,0);
        else if(a.eixo==='y') m.makeTranslation(0,d,0);
        else m.makeTranslation(0,0,d);
      } else if(a.tipo==='pulso'){
        const s=1+(a.amp||0)*Math.sin(fase);
        m.makeScale(s,s,s);
      } else continue;
      out.premultiply(m);
    }
  }
  const px=(pivo&&pivo[0])||0, py=(pivo&&pivo[1])||0, pz=(pivo&&pivo[2])||0;
  if(px||py||pz){
    _M2.makeTranslation(px,py,pz);
    _M2.multiply(out);
    _M3.makeTranslation(-px,-py,-pz);
    _M2.multiply(_M3);
    out.copy(_M2);
  }
}

function vigiaVoz(stream,encerra,aoFalar,semFala=true,live=false){

  }catch(e){return ()=>{}}
  const buf=new Uint8Array(an.fftSize),inicio=performance.now();
  const confirma=live?VAD.live.confirma:VAD.confirma;
  const fator=live?VAD.live.fator:VAD.fator;
  const limiarMin=live?VAD.live.minLimiar:VAD.minLimiar;
  const ignora=live?VAD.live.ignora:0;
  let ultima=inicio,primeira=0,ruido=0,n=0,parado=false,raf=0,avisou=false,ultimoLog=0;

    const limiar=Math.max(limiarMin,ruido*fator);

      ultimoLog=agora;console.log('[live] rms='+rms.toFixed(3)+' ruído='+ruido.toFixed(3)+' limiar='+limiar.toFixed(3));
    }
    if(rms>limiar){
      if(!primeira)primeira=agora;
      ultima=agora;
    }
    // modo live: fala contínua por `confirma` interrompe o TTS (uma vez só)
    if(aoFalar&&!avisou&&primeira&&agora-primeira>=confirma){

    }

    if(VAD.auto&&primeira&&agora-ultima>VAD.silencio&&ultima-primeira>=VAD.minFala){parado=true;nivel=0;encerra('silencio');return}

      const salvo=fontesSalvas().some(x=>x.link===it.link);
      bSalvar.textContent=salvo?'Salvo':'Salvar';
      bSalvar.classList.toggle('on',salvo);
      bSalvar.disabled=!it.link;
    }
  }
  const mostra=()=>{
    const it=itens[i]||{};
    usouFallback=false;
    img.style.opacity='';
    img.src=(palco&&it.urlGrande)||it.url||'';
    try{img.animate([{opacity:.25},{opacity:1}],{duration:280,easing:'ease-out'})}catch(e){}
    img.alt=it.titulo||'Imagem';
    leg.textContent='';
    const b=document.createElement('b');b.textContent=it.titulo||'';
    leg.appendChild(b);
    if(it.link){const a=document.createElement('a');a.href=it.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent=' · ver na Wikipedia';leg.appendChild(a)}
    if(it.credito){const c=document.createElement('span');c.textContent=' · '+it.credito;c.style.opacity='.55';leg.appendChild(c)}
    dots.querySelectorAll('.img-dot').forEach((d,n)=>d.classList.toggle('on',n===i));
    atualizaMenu();
  };
  dots.innerHTML=itens.map((_,n)=>`<button class="img-dot" type="button" data-n="${n}" title="Imagem ${n+1}"></button>`).join('');
  const avanca=()=>{i=(i+1)%itens.length;mostra()};
  let timer=setInterval(avanca,6000);
  const reinicia=()=>{clearInterval(timer);timer=setInterval(avanca,6000)};
  dots.querySelectorAll('.img-dot').forEach(d=>d.onclick=()=>{i=+d.dataset.n;mostra();reinicia()});
  corpo.querySelector('.img-nav.prev').onclick=()=>{i=(i-1+itens.length)%itens.length;mostra();reinicia()};
  corpo.querySelector('.img-nav.next').onclick=()=>{i=(i+1)%itens.length;mostra();reinicia()};
  mostra();
  return ()=>{clearInterval(timer);fecharMenuPalco()};
}
function _textoInline(el,texto){
  const partes=String(texto).split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
  for(const parte of partes){
    if(!parte)continue;
    if(parte.startsWith('**')&&parte.endsWith('**')){
      const s=document.createElement('strong');s.textContent=parte.slice(2,-2);el.appendChild(s);
    }else if(parte.startsWith('`')&&parte.endsWith('`')){
      const c=document.createElement('code');c.textContent=parte.slice(1,-1);el.appendChild(c);
    }else{
      el.appendChild(document.createTextNode(parte));
    }
  }
}
function renderTexto(corpo,p){
  const d=p.dados||{};
  corpo.classList.add('texto-painel');
  const txt=String(d.texto||'').replace(/\r/g,'').trim();
  if(!txt){corpo.textContent='Sem conteúdo.';return}
  const box=document.createElement('div');box.className='texto-corpo';
  for(const bloco of txt.split(/\n\s*\n/)){
    const linhas=bloco.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!linhas.length)continue;
    if(linhas.every(l=>/^[-*]\s+/.test(l))){
      const ul=document.createElement('ul');
      linhas.forEach(l=>{const li=document.createElement('li');_textoInline(li,l.replace(/^[-*]\s+/,''));ul.appendChild(li)});
      box.appendChild(ul);
    }else if(/^#{1,3}\s+/.test(linhas[0])){
      const h=document.createElement('h3');_textoInline(h,linhas[0].replace(/^#{1,3}\s+/,''));
      box.appendChild(h);
      if(linhas.length>1){const p2=document.createElement('p');_textoInline(p2,linhas.slice(1).join(' '));box.appendChild(p2)}
    }else{
      const p2=document.createElement('p');_textoInline(p2,linhas.join(' '));box.appendChild(p2);
    }
  }
  corpo.appendChild(box);
  if(d.fonte||d.link){
    const f=document.createElement('div');f.className='texto-fonte';
    if(d.fonte)f.appendChild(document.createTextNode(d.fonte));
    if(d.link){
      if(d.fonte)f.appendChild(document.createTextNode(' · '));
      const a=document.createElement('a');a.href=d.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='abrir fonte';f.appendChild(a);
    }
    corpo.appendChild(f);
  }
}

function temaDaPergunta(texto){
  let s=String(texto||'').replace(/\s+/g,' ').trim();
  s=s.replace(/^(?:me\s+)?(?:mostre|mostra|fale|fala|explique|explica|quero|queria|gostaria|pesquise|pesquisa|busque|busca|abra|abre|traga|traz|conte|conta)\s+(?:mais\s+)?(?:sobre\s+|de\s+|do\s+|da\s+)?/i,'');
  s=s.replace(/^(?:saber|conhecer|entender|aprender)\s+(?:mais\s+)?(?:sobre\s+|de\s+|do\s+|da\s+)?/i,'');
  s=s.replace(/^(?:o que (?:é|e)|quem (?:é|e)|como funciona|como)\s+/i,'');
  s=s.replace(/^(?:a|o|as|os|um|uma)\s+/i,'');
  s=s.replace(/[?？！!]+$/,'').trim();
  return (s||String(texto||'')).slice(0,80);
}

      const r=await fetch('/api/painel_acao',{method:'POST',headers:{'Content-Type':'application/json'},
