</style></head><body>
<canvas id="c"></canvas><div id="tela"><div id="paineis"></div></div><div id="palco" aria-hidden="true"><div class="palco-fundo"></div><div class="palco-card"><div class="palco-h"><b id="palco-titulo"></b><button class="painel-x" id="palco-x" type="button" title="Fechar">×</button></div><div id="palco-corpo"></div></div></div><div id="hud"></div><div id="cap"></div><div id="chat" class="vazio"><div id="msgs"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=Math.random,$=id=>document.getElementById(id);
// Ajustes de voz. Por enquanto no código; se virar config, o lugar é "ui_voz" no ciel_config.json.
const PAUSA_FALA_MS=2000;   // silêncio (ms) que encerra a gravação; ?pausa=1500 testa outro valor
let N,cache,geo,pts,amp=0,T=0;
const cur={st:'repouso',sh:'esfera',tx:'CIEL'};
const rd=new THREE.WebGLRenderer({canvas:$('c'),alpha:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,100),grp=new THREE.Group();sc.add(grp);

// MAXL = número máximo de camadas suportadas pelo shader.
const MAXL=16;
const u={
  uT:{value:1},uTime:{value:0},uT0:{value:0},uAmp:{value:0},uSize:{value:2.4},
  uPix:{value:rd.getPixelRatio()},uZ:{value:8},
  uMatCamada:{value:Array.from({length:MAXL},()=>new THREE.Matrix4())},
  uMatFrom:{value:Array.from({length:MAXL},()=>new THREE.Matrix4())}
};
const mat=new THREE.ShaderMaterial({uniforms:u,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`attribute vec4 aFrom,aTo;attribute float aR;attribute float aCamada;attribute float aCamadaFrom;
uniform float uT,uTime,uT0,uAmp,uSize,uPix,uZ;uniform mat4 uMatCamada[${MAXL}];uniform mat4 uMatFrom[${MAXL}];
varying vec3 vC;varying float vA;
vec2 rot(vec2 p,float a){float c=cos(a),s=sin(a);return vec2(c*p.x-s*p.y,s*p.x+c*p.y);}
void main(){
vec3 a=aFrom.xyz;a.xy=rot(a.xy,uT0*aFrom.w);
vec3 b=aTo.xyz;b.xy=rot(b.xy,uTime*aTo.w);
float t=clamp((uT-aR*.45)/.55,0.,1.);t=t*t*(3.-2.*t);
vec3 p=mix(a,b,t);float k=sin(3.14159*t);
vec3 n=vec3(sin(aR*40.+uTime*1.3),cos(aR*57.+uTime*1.1),sin(aR*23.+uTime*.9));
p+=n*k*1.8+n*.015;p*=1.+uAmp*(.7+.3*sin(aR*50.));
int li=int(aCamada+.5),lf=int(aCamadaFrom+.5);
mat4 LM=mat4(1.0),LF=mat4(1.0);
for(int i=0;i<${MAXL};i++){ if(i==li) LM=uMatCamada[i]; if(i==lf) LF=uMatFrom[i]; }
p=mix((LF*vec4(p,1.0)).xyz,(LM*vec4(p,1.0)).xyz,t);
vec4 mv=modelViewMatrix*vec4(p,1.);
gl_PointSize=min(uSize*uPix*(.6+aR)*(uZ/-mv.z),48.);
gl_Position=projectionMatrix*mv;
vC=mix(vec3(.12,.42,1.),vec3(.6,.95,1.),aR*aR)+uAmp*.6;vA=.55+.45*aR;}`,
fragmentShader:`varying vec3 vC;varying float vA;
void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float f=smoothstep(.5,0.,d);gl_FragColor=vec4(vC*1.3,f*vA);}`});

// amostradores: cada um adiciona n pontos [x,y,z,spin]
const box=(o,n,w,h,d,cx,cy,cz)=>{const A=[w*h*2,w*d*2,h*d*2],S=A[0]+A[1]+A[2];
for(let i=0;i<n;i++){const r=R()*S,s=R()<.5?-.5:.5,a=R()-.5,b=R()-.5;
if(r<A[0])o.push(a*w+cx,b*h+cy,s*d+cz,0);else if(r<A[0]+A[1])o.push(a*w+cx,s*h+cy,b*d+cz,0);else o.push(s*w+cx,a*h+cy,b*d+cz,0)}};
const cyl=(o,n,r,w,cx,cy,cz)=>{for(let i=0;i<n;i++){const a=R()*6.283;let q=r,z=(R()-.5)*w;if(R()<.35){q=r*Math.sqrt(R());z=(R()<.5?-.5:.5)*w}o.push(Math.cos(a)*q+cx,Math.sin(a)*q+cy,z+cz,0)}};
const sph=(o,n,r,cx,cy,cz,sp)=>{for(let i=0;i<n;i++){const v=R()*2-1,a=R()*6.283,s=Math.sqrt(1-v*v);o.push(cx+s*Math.cos(a)*r,cy+s*Math.sin(a)*r,cz+v*r,sp)}};
const ring=(o,n,r,sp,j)=>{for(let i=0;i<n;i++){const a=R()*6.283,q=r+(R()-.5)*j;o.push(Math.cos(a)*q,Math.sin(a)*q,(R()-.5)*.06,sp)}};
const tri=(o,n,r,rot,sp)=>{for(let i=0;i<n;i++){const a=rot+((R()*3)|0)*2.0944,b=a+2.0944,t=R();o.push(r*(Math.cos(a)*(1-t)+Math.cos(b)*t),r*(Math.sin(a)*(1-t)+Math.sin(b)*t),(R()-.5)*.06,sp)}};

// mk devolve {pos: Float32Array(N*4), camada: Float32Array(N)}
function mk(parts, camadasPorParte){
  const o=[], ca=[];
  let used=0;
  parts.forEach(([f,fn],i)=>{
    const n=i==parts.length-1?N-used:Math.round(N*f);
    const antes=o.length/4;
    fn(o,n);
    const c=camadasPorParte?(+camadasPorParte[i]||0):0;
    for(let j=antes;j<antes+n;j++) ca.push(c);
    used+=n;
  });
  const a=Float32Array.from(o);
  const c=Float32Array.from(ca);
  for(let i=N-1;i>0;i--){
    const j=(R()*(i+1))|0;
    for(let k=0;k<4;k++){const t=a[i*4+k];a[i*4+k]=a[j*4+k];a[j*4+k]=t}
    const t=c[i];c[i]=c[j];c[j]=t;
  }
  return {pos:a,camada:c};
}

const W=[[1.3,.9],[1.3,-.9],[-1.3,.9],[-1.3,-.9]].map(([x,z])=>[.105,(o,n)=>cyl(o,n,.45,.3,x,-.6,z)]);
const S={
esfera:()=>mk([[1,(o,n)=>{for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),t=i*2.39996;o.push(Math.cos(t)*r*2.2,y*2.2,Math.sin(t)*r*2.2,0)}}]]),
circulo:()=>mk([[.2,(o,n)=>ring(o,n,3.4,.12,.07)],[.12,(o,n)=>ring(o,n,3,.12,.05)],
[.1,(o,n)=>{for(let i=0;i<n;i++){const a=((R()*36)|0)*.17453,q=3.05+R()*.3;o.push(Math.cos(a)*q,Math.sin(a)*q,0,.12)}}],
[.17,(o,n)=>tri(o,n,2.5,0,-.18)],[.17,(o,n)=>tri(o,n,2.5,1.0472,-.18)],
[.08,(o,n)=>ring(o,n,1.5,.3,.05)],[.06,(o,n)=>tri(o,n,.95,.5,-.5)],[.1,(o,n)=>sph(o,n,.25,0,0,0,0)]]),
carro:()=>mk([[.38,(o,n)=>box(o,n,4,.7,1.8,0,-.15,0)],[.2,(o,n)=>box(o,n,2.1,.65,1.6,-.25,.5,0)],...W]),
casa:()=>mk([[.45,(o,n)=>box(o,n,3,2,2.4,0,-.5,0)],
[.3,(o,n)=>{for(let i=0;i<n;i++){const s=R()<.5?-1:1,t=R();o.push(s*1.75*(1-t),.5+1.3*t,(R()-.5)*2.7,0)}}],
[.1,(o,n)=>box(o,n,.6,1.1,.12,0,-.95,1.25)],[.07,(o,n)=>box(o,n,.5,.5,.1,-.9,-.3,1.22)],[.08,(o,n)=>box(o,n,.5,.5,.1,.9,-.3,1.22)]]),
solar:()=>{const P=[[.22,(o,n)=>sph(o,n,.5,0,0,0,0)]];
[1,1.6,2.2,2.9,3.6].forEach((r,i)=>{const sp=.9/(i+1),a=R()*6.283;
P.push([.05,(o,n)=>ring(o,n,r,sp,.03)]);P.push([.1,(o,n)=>sph(o,n,.09+.03*i,Math.cos(a)*r,Math.sin(a)*r,0,sp)])});return mk(P)},
palavra:t=>{const c=document.createElement('canvas'),x=c.getContext('2d'),f='bold 120px system-ui,sans-serif';
x.font=f;const w=Math.ceil(x.measureText(t).width)+40,h=180;c.width=w;c.height=h;
x.font=f;x.textBaseline='middle';x.textAlign='center';x.fillStyle='#fff';x.fillText(t,w/2,h/2);
const d=x.getImageData(0,0,w,h).data,p=[];for(let i=3;i<d.length;i+=4)if(d[i]>128)p.push((i-3)/4);
const k=Math.min(.012,7/w);

function vigiaVoz(stream,encerra,aoFalar,semFala=true,live=false){

    audioCtx=audioCtx||new Ctx();

  const fator=live?VAD.live.fator:VAD.fator;

  const ignora=live?VAD.live.ignora:0;
  let ultima=inicio,primeira=0,ruido=0,n=0,parado=false,raf=0,avisou=false,ultimoLog=0;

    }
    if(rms>limiar){

      ultima=agora;
    }

        pos={coords:{latitude:-3.7319,longitude:-38.5267}};
        origem='Fortaleza (localização padrão)';
      }
      if(!vivo)return;
      const lat=pos.coords.latitude.toFixed(4),lon=pos.coords.longitude.toFixed(4);
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`;
      abort=new AbortController();
      try{
        const r=await fetch(url,{signal:abort.signal});
        if(!r.ok)throw Error('HTTP '+r.status);
        const d=await r.json(),cur=d.current||{},dia=d.daily||{};
        const info=MAPA[cur.weather_code]||['🌡️','Tempo'];
        ico.textContent=info[0];temp.textContent=num(cur.temperature_2m);cond.textContent=info[1];
        const tmax=num(dia.temperature_2m_max&&dia.temperature_2m_max[0]),tmin=num(dia.temperature_2m_min&&dia.temperature_2m_min[0]);
        sub.textContent=`máx ${tmax} · mín ${tmin} · sensação ${num(cur.apparent_temperature)} · vento ${typeof cur.wind_speed_10m==='number'?Math.round(cur.wind_speed_10m):'--'} km/h`;
        local.textContent=origem+' · Open-Meteo';
      }catch(e){
        if(e.name==='AbortError')return;
        cond.textContent='Clima indisponível';sub.textContent='Não consegui consultar o Open-Meteo agora.';
      }
    };
    btn.onclick=carregar;carregar();
    return ()=>{vivo=false;if(abort)abort.abort()};
  }
};
function renderImagens(corpo,p,palco){
  const itens=(p.dados&&p.dados.itens)||[];
  corpo.classList.add('img-painel');
  if(!itens.length){corpo.textContent='Sem imagens neste painel.';return}
  if(!palco){
    corpo.innerHTML='<div class="img-preview"><img loading="lazy" decoding="async" alt=""></div><div class="img-legenda"></div><button class="img-ampliar" type="button">Abrir no centro</button>';
    const img=corpo.querySelector('img'),leg=corpo.querySelector('.img-legenda');
    let j=0;
    const mostra=()=>{
      const it=itens[j]||{};
      img.style.opacity='';img.src=it.url||'';img.alt=it.titulo||'Imagem';
      try{img.animate([{opacity:.25},{opacity:1}],{duration:280,easing:'ease-out'})}catch(e){}
      leg.textContent='';
      const b=document.createElement('b');b.textContent=it.titulo||'Imagens';leg.appendChild(b);
      const c=document.createElement('span');c.textContent=' · '+(j+1)+'/'+itens.length+' · '+(it.credito||'Wikimedia');c.style.opacity='.6';leg.appendChild(c);
    };
    img.onerror=()=>{img.style.opacity='.25'};
    const timer=setInterval(()=>{j=(j+1)%itens.length;mostra()},6000);
    const prev=corpo.querySelector('.img-preview');
    if(prev){prev.title='Abrir no centro';prev.style.cursor='pointer';prev.onclick=()=>abrirPalco(p)}
    corpo.querySelector('.img-ampliar').onclick=()=>abrirPalco(p);
    mostra();
    return ()=>clearInterval(timer);
  }
  corpo.innerHTML='<div class="img-tela"><img loading="lazy" decoding="async" alt=""><button class="img-nav prev" type="button" title="Anterior">‹</button><button class="img-nav next" type="button" title="Próxima">›</button></div><div class="img-legenda"></div><div class="img-dots"></div>';
  const img=corpo.querySelector('img'),leg=corpo.querySelector('.img-legenda'),dots=corpo.querySelector('.img-dots');
  let usouFallback=false;
  img.onerror=()=>{
    if(palco&&!usouFallback){usouFallback=true;img.src=(itens[i]&&itens[i].url)||'';}
    else{img.style.opacity='.25';img.alt='Imagem indisponível'}
  };
  let i=0;
  const mostra=()=>{
    const it=itens[i]||{};
    usouFallback=false;
    img.style.opacity='';
    img.src=(palco&&it.urlGrande)||it.url||'';
    try{img.animate([{opacity:.25},{opacity:1}],{duration:280,easing:'ease-out'})}catch(e){}
    img.alt=it.titulo||'Imagem';
    leg.textContent='';
    const b=document.createElement('b');b.textContent=it.titulo||'';
    leg.appendChild(b);
    if(it.link){const a=document.createElement('a');a.href=it.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent=' · ver na Wikipedia';leg.appendChild(a)}
    if(it.credito){const c=document.createElement('span');c.textContent=' · '+it.credito;c.style.opacity='.55';leg.appendChild(c)}
    dots.querySelectorAll('.img-dot').forEach((d,n)=>d.classList.toggle('on',n===i));
  };
  dots.innerHTML=itens.map((_,n)=>`<button class="img-dot" type="button" data-n="${n}" title="Imagem ${n+1}"></button>`).join('');
  const avanca=()=>{i=(i+1)%itens.length;mostra()};
  let timer=setInterval(avanca,6000);
  const reinicia=()=>{clearInterval(timer);timer=setInterval(avanca,6000)};
  dots.querySelectorAll('.img-dot').forEach(d=>d.onclick=()=>{i=+d.dataset.n;mostra();reinicia()});
  corpo.querySelector('.img-nav.prev').onclick=()=>{i=(i-1+itens.length)%itens.length;mostra();reinicia()};
  corpo.querySelector('.img-nav.next').onclick=()=>{i=(i+1)%itens.length;mostra();reinicia()};
  mostra();
  return ()=>clearInterval(timer);
}
function _textoInline(el,texto){
  const partes=String(texto).split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
  for(const parte of partes){
    if(!parte)continue;
    if(parte.startsWith('**')&&parte.endsWith('**')){
      const s=document.createElement('strong');s.textContent=parte.slice(2,-2);el.appendChild(s);
    }else if(parte.startsWith('`')&&parte.endsWith('`')){
      const c=document.createElement('code');c.textContent=parte.slice(1,-1);el.appendChild(c);
    }else{
      el.appendChild(document.createTextNode(parte));
    }
  }
}
function renderTexto(corpo,p){
  const d=p.dados||{};
  corpo.classList.add('texto-painel');
  const txt=String(d.texto||'').replace(/\r/g,'').trim();
  if(!txt){corpo.textContent='Sem conteúdo.';return}
  const box=document.createElement('div');box.className='texto-corpo';
  for(const bloco of txt.split(/\n\s*\n/)){
    const linhas=bloco.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!linhas.length)continue;
    if(linhas.every(l=>/^[-*]\s+/.test(l))){
      const ul=document.createElement('ul');
      linhas.forEach(l=>{const li=document.createElement('li');_textoInline(li,l.replace(/^[-*]\s+/,''));ul.appendChild(li)});
      box.appendChild(ul);
    }else if(/^#{1,3}\s+/.test(linhas[0])){
      const h=document.createElement('h3');_textoInline(h,linhas[0].replace(/^#{1,3}\s+/,''));
      box.appendChild(h);
      if(linhas.length>1){const p2=document.createElement('p');_textoInline(p2,linhas.slice(1).join(' '));box.appendChild(p2)}
    }else{
      const p2=document.createElement('p');_textoInline(p2,linhas.join(' '));box.appendChild(p2);
    }
  }
  corpo.appendChild(box);
  if(d.fonte||d.link){
    const f=document.createElement('div');f.className='texto-fonte';
    if(d.fonte)f.appendChild(document.createTextNode(d.fonte));
    if(d.link){
      if(d.fonte)f.appendChild(document.createTextNode(' · '));
      const a=document.createElement('a');a.href=d.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='abrir fonte';f.appendChild(a);
    }
    corpo.appendChild(f);
  }
}
PAINEIS_RENDER.texto=renderTexto;
function renderNoticias(corpo,p){
  const d=p.dados||{},itens=Array.isArray(d.itens)?d.itens:[];

const paineisAbertos=new Map();
let painelFoco=null,palcoAtual=null,palcoCleanup=null;
function limparFoco(){
  if(!painelFoco)return;
  const s=paineisAbertos.get(painelFoco);
  if(s)s.el.classList.remove('foco');
  painelFoco=null;$('tela').classList.remove('temfoco');
}
function abrirPalco(p){
  const render=p&&PAINEIS_RENDER[p.tipo];
  if(!render||!render.palco)return;
  if(palcoAtual===p.id){fecharPalco();return}
  fecharPalco();
  palcoAtual=p.id;$('palco-titulo').textContent=p.titulo||p.tipo;
  const corpo=$('palco-corpo');corpo.innerHTML='';
  try{palcoCleanup=render.palco(corpo,p)||null}catch(e){corpo.textContent='Falha ao abrir o painel.'}
  $('palco').classList.add('aberto');$('palco').setAttribute('aria-hidden','false');
}
function abrirPalcoPorId(id){
  if(!id||palcoAtual===id)return;
  const s=paineisAbertos.get(id);
  if(s&&s.p)abrirPalco(s.p);
}
function fecharPalco(){
  if(!palcoAtual)return;
  palcoAtual=null;
  try{if(palcoCleanup)palcoCleanup()}catch(e){}
  palcoCleanup=null;
  $('palco').classList.remove('aberto');$('palco').setAttribute('aria-hidden','true');
  $('palco-corpo').innerHTML='';
}
function focarPainel(id,rolar=true){
  const s=paineisAbertos.get(id);if(!s)return;
  if(painelFoco&&painelFoco!==id){const a=paineisAbertos.get(painelFoco);if(a)a.el.classList.remove('foco')}
  painelFoco=id;s.el.classList.add('foco');$('tela').classList.add('temfoco');
  if(rolar)s.el.scrollIntoView({block:'nearest',behavior:'smooth'});
  s.el.classList.remove('pulso');void s.el.offsetWidth;s.el.classList.add('pulso');
  setTimeout(()=>s.el.classList.remove('pulso'),1200);
}
function alternarFoco(id){if(painelFoco===id)limparFoco();else focarPainel(id)}
function focarPorTexto(txt){
  if(!paineisAbertos.size)return;
  const t=String(txt||'').toLowerCase();
  for(const [id,s] of paineisAbertos){
    const b=s.el.querySelector('.painel-h b'),titulo=b?b.textContent.toLowerCase():'';
    const nomes=[titulo].concat((s.p&&s.p.nomes)||[]).map(x=>String(x).toLowerCase()).filter(n=>n.length>2);
    if(nomes.some(n=>t.includes(n))){focarPainel(id);return}
  }
}
function fecharPainel(id){
  const s=paineisAbertos.get(id);if(!s)return;
  if(palcoAtual===id)fecharPalco();
  if(painelFoco===id){painelFoco=null;$('tela').classList.remove('temfoco')}
  try{if(s.cleanup)s.cleanup()}catch(e){}
  s.el.remove();paineisAbertos.delete(id);
}
function fecharTodosPaineis(){[...paineisAbertos.keys()].forEach(fecharPainel)}
function abrirPainel(p){
  if(!p||!p.id||!PAINEIS_RENDER[p.tipo])return;
  fecharPainel(p.id);
  const el=document.createElement('section');
  el.className='painel';el.dataset.slot=p.slot||'top-left';el.dataset.id=p.id;el.dataset.tipo=p.tipo;
  const h=document.createElement('div');h.className='painel-h';h.title='Clique para destacar';
  const b=document.createElement('b');b.textContent=p.titulo||p.tipo;
  const tag=document.createElement('span');tag.className='painel-tag';tag.textContent='fala: '+(p.fala||'nunca');tag.title='Política de fala deste painel';
  const x=document.createElement('button');x.className='painel-x';x.type='button';x.textContent='×';x.title='Fechar';
  x.onclick=(e)=>{e.stopPropagation();fecharPainel(p.id)};
  h.onclick=(e)=>{if(e.target.closest('.painel-x'))return;alternarFoco(p.id)};
  h.append(b,tag,x);
  const corpo=document.createElement('div');el.append(h,corpo);
  $('paineis').appendChild(el);
  let cleanup=null;
  try{cleanup=PAINEIS_RENDER[p.tipo](corpo,p)}catch(e){corpo.textContent='Falha ao montar o painel.'}
  paineisAbertos.set(p.id,{el,cleanup,p});
}
